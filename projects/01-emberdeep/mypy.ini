# Type-checking config: `python -m mypy emberdeep` (from this folder).
#
# Entities are one dataclass with optional components (fighter, inventory, equipment,
# item), ECS-style. The player and monsters always have a fighter, but the type can't say
# so without splitting the class; strict-optional checking is therefore off and the code
# guards optional components where they really can be missing (floor items, corpses).
[mypy]
python_version = 3.10
strict_optional = False
warn_redundant_casts = True
check_untyped_defs = True
ignore_missing_imports = True
