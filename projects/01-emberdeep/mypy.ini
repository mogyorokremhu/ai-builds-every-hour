# Type-checking config: `python -m mypy emberdeep` (from this folder). Strict-optional is ON.
#
# Entities are one dataclass with optional components (fighter, inventory, equipment,
# item), ECS-style. Code that knows a component exists uses the typed accessors
# `Entity.fight`, `.pack`, `.gear` and `.thing`; code that might meet a missing one
# checks the Optional field (`e.fighter`, `e.item`, ...) first.
[mypy]
python_version = 3.10
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True
ignore_missing_imports = True
