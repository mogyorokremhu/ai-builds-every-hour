<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hexfall replay viewer</title>
<style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:1rem auto;padding:0 1rem;background:#16181d;color:#e6e6e6}
button,input{font:inherit;margin:.15rem}
#log{height:320px;overflow:auto;background:#0f1013;border:1px solid #333;padding:.4rem;font-family:monospace;font-size:13px}
#log div.cur{background:#2c3e66}
#status{margin:.6rem 0;font-weight:600}
</style></head><body>
<h1>Hexfall replay viewer</h1>
<p>Load a file made with <code>node tools/replay.mjs record</code>.</p>
<input type="file" id="file" accept=".json,application/json">
<div id="ui" hidden>
  <div>
    <button id="first">⏮</button><button id="prev">◀</button><button id="play">▶ Play</button>
    <button id="next">▶|</button><button id="last">⏭</button>
    <label>Turn <input id="turn" type="number" min="1" value="1" style="width:4rem"></label>
  </div>
  <input id="slider" type="range" min="0" value="0" style="width:100%">
  <div id="status"></div>
  <div id="log"></div>
</div>
<script type="module">
import { ReplayViewer, describeAction } from "./src/replayviewer.js";
import { Game } from "./src/game.js";
const $ = (id) => document.getElementById(id);
let v = null, stop = null;
function render() {
  const s = v.summary();
  $("slider").value = s.step;
  $("status").textContent = `Step ${s.step}/${s.of} · turn ${s.turn} (${s.side}) · red ${s.red} vs blue ${s.blue} units` + (s.winner ? ` · winner: ${s.winner}` : "");
  document.querySelectorAll("#log div").forEach((d, i) => d.classList.toggle("cur", i === s.step - 1));
  const cur = document.querySelector("#log div.cur"); cur?.scrollIntoView({ block: "nearest" });
}
function load(file) {
  v = new ReplayViewer(file);
  // Describe every action with the game state before it, using a scratch viewer.
  const scratch = new ReplayViewer(file); const log = $("log"); log.textContent = "";
  file.actions.forEach((a, i) => {
    const d = document.createElement("div");
    d.textContent = `${i + 1}. ${describeAction(scratch.game, a)}`;
    d.onclick = () => { v.seek(i + 1); render(); };
    log.append(d); scratch.step();
  });
  $("slider").max = v.length; $("ui").hidden = false; render();
}
$("file").onchange = async (e) => { try { load(JSON.parse(await e.target.files[0].text())); } catch (err) { alert(err.message); } };
$("first").onclick = () => { v.seek(0); render(); };
$("prev").onclick = () => { v.back(); render(); };
$("next").onclick = () => { v.step(); render(); };
$("last").onclick = () => { v.seek(v.length); render(); };
$("slider").oninput = (e) => { v.seek(+e.target.value); render(); };
$("turn").onchange = (e) => { v.seekTurn(+e.target.value); render(); };
$("play").onclick = () => {
  if (stop) { stop(); stop = null; $("play").textContent = "▶ Play"; return; }
  if (v.atEnd) v.seek(0);
  $("play").textContent = "⏸ Pause";
  stop = v.play(() => { render(); if (v.atEnd) { stop = null; $("play").textContent = "▶ Play"; } }, 350);
};
</script></body></html>
