<!doctype html><meta charset="utf-8"><title>Snake</title>
<style>body{background:#111;color:#eee;font-family:sans-serif;text-align:center}canvas{background:#000;border:2px solid #333}</style>
<h2>Snake</h2><canvas id="c" width="400" height="400"></canvas><p id="s">Arrow keys / WASD · Space restarts</p>
<script>
// Classic snake on a 20x20 wrapping grid; speed rises with each apple.
const g=document.getElementById('c').getContext('2d'), N=20, T=20, sc=document.getElementById('s');
let snake, dir, nd, apple, score, dead, delay;
function rnd(){let p; do p=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]; while(snake.some(s=>s[0]===p[0]&&s[1]===p[1])); return p;}
function init(){snake=[[10,10],[9,10],[8,10]]; dir=nd=[1,0]; score=0; dead=false; delay=140; apple=rnd(); sc.textContent='Score 0'; clearTimeout(init.t); tick();}
function tick(){
  dir=nd; const h=[(snake[0][0]+dir[0]+N)%N,(snake[0][1]+dir[1]+N)%N];
  if(snake.some(s=>s[0]===h[0]&&s[1]===h[1])){dead=true; sc.textContent='Game over — score '+score+' (Space to restart)'; draw(); return;}
  snake.unshift(h);
  if(h[0]===apple[0]&&h[1]===apple[1]){score++; delay=Math.max(50,delay-4); apple=rnd(); sc.textContent='Score '+score;} else snake.pop();
  draw(); init.t=setTimeout(tick,delay);
}
function draw(){g.fillStyle='#000';g.fillRect(0,0,400,400);
  g.fillStyle='#e44';g.fillRect(apple[0]*T+2,apple[1]*T+2,T-4,T-4);
  snake.forEach((s,i)=>{g.fillStyle=i?'#4c4':'#9f9';g.fillRect(s[0]*T+1,s[1]*T+1,T-2,T-2);});}
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
onkeydown=e=>{if(e.key===' '&&dead){init();return;} const v=K[e.key]; if(v&&!(v[0]===-dir[0]&&v[1]===-dir[1])){nd=v; e.preventDefault();}};
init();
</script>
